name: dbt CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install dbt-duckdb
      - run: mkdir -p ~/.dbt && cp profiles.example.yml ~/.dbt/profiles.yml
      - name: Build, snapshot and test everything
        run: dbt build
