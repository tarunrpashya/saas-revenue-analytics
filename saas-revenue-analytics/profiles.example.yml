# Copy to ~/.dbt/profiles.yml. DuckDB runs locally and in CI; Snowflake is the target warehouse.
saas_revenue_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: saas_revenue.duckdb
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: TRANSFORMER
      warehouse: TRANSFORMING
      database: ANALYTICS
      schema: dbt_dev
      threads: 8
